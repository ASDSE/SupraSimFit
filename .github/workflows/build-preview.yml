name: Build preview

# Executables of a branch for testing, without a published release: each OS's
# zip is attached to one draft release, which only repository members see and
# which creates no tag. Release assets do not count against the Actions
# artifact storage quota.
on:
  push:
    branches:
      - feat/ka-uncertainty-framework
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_TAG: preview-ka-uncertainty-framework
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Replace the draft release with an empty one for this commit
        run: |
          gh release delete "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" \
            --title "Preview build (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Unofficial executables of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not a release."

  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Build with PyInstaller
        run: uv run --with pyinstaller pyinstaller --clean -y --distpath ./dist --workpath ./build SupraSimFit.spec

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/SupraSimFit.app SupraSimFit-preview-macos.zip

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../SupraSimFit-preview-linux.zip ./SupraSimFit

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path 'dist\SupraSimFit\*' -DestinationPath "SupraSimFit-preview-windows.zip"
        shell: pwsh

      - name: Attach to the draft release
        run: gh release upload "$PREVIEW_TAG" SupraSimFit-preview-*.zip --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
